  <!-- Apply the saved theme before rendering the page. -->

  <script>
    (function () {
      try {
        const savedTheme =
          localStorage.getItem("ami-theme");

        const preferredTheme =
          savedTheme === "dark" ||
          savedTheme === "light"
            ? savedTheme
            : window.matchMedia(
                "(prefers-color-scheme: dark)"
              ).matches
                ? "dark"
                : "light";

        document.documentElement.setAttribute(
          "data-theme",
          preferredTheme
        );
      } catch (error) {
        document.documentElement.setAttribute(
          "data-theme",
          "light"
        );
      }
    })();
  </script>
